<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link
    href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    rel="stylesheet"
    >
    <link
    rel="stylesheet"
    href="style.css"
    media="screen"
    charset="utf-8"
    >
  </head>
  <body class="page">
    <header class="matrix-block">
      <h1>Todo App</h1>
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
      <a
      class="more-info"
      href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="content-block">
      <section id="add-task-section">
        <label for="new-task">
          Add Item
        </label>
        <form class="task__row">
          <input
          id="new-task"
          class="task"
          type="text"
          >
            <button type="button">
              Add
            </button>
        </form>
      </section>
      <h3 id="todo-heading">Todo</h3>
      <ul id="todo-list" role="list" aria-labelledby="todo-heading">
        <li role="listitem">
          <input type="checkbox">
          <label class="task">
            Pay Bills
          </label>
          <input type="text" class="task" aria-label="Edit task">
          <button class="edit">
            Edit
          </button>
          <button class="task__delete" aria-label="Remove task">
            <img src="./remove.svg" alt="Remove task">
          </button>
        </li>
        <li role="listitem">
          <input type="checkbox">
          <label class="task">
            Go Shopping
          </label>
          <input
          type="text"
          class="task"
          aria-label="Edit task"
          >
          <button class="edit">Edit</button>
          <button class="task__delete" aria-label="Remove task">
            <img src="./remove.svg" alt="Remove task">
          </button>
        </li>
      </ul>
      <h3 id="completed-heading">Completed</h3>
      <ul id="done-list" class="done-list" role="list" aria-labelledby="completed-heading">
        <li role="listitem">
          <input type="checkbox" checked>
          <label class="task">
            See the Doctor
          </label>
          <input type="text" class="task">
          <button class="edit">
            Edit
          </button>
          <button class="task__delete">
            <img src="./remove.svg" alt="Remove task">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
